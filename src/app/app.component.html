<!-- Optional: App Title or Header -->
<header style="
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  padding: 10px;
  background: url('/assets/icons/headerImage.jpg') no-repeat center center;
  background-size: cover;
  color: #fff;
  text-align: center;
  z-index: 9999;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  font-weight: 600;
  font-size: 22px;
  text-shadow: 1px 1px 4px rgba(0,0,0,0.7);
">
  <!-- Overlay for reduced opacity -->
  <div style="
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.4); /* dark overlay for readability */
    z-index: 0;
  "></div>
  <h1 style="position: relative; z-index: 1; margin: 0;">Online Election System</h1>
</header>

<!-- Router outlet -->
<main style="
  margin-top: 60px;  /* space for header */
  margin-bottom: 35px; /* space for footer */
  overflow-y: auto;
  height: calc(100vh - 95px); /* full viewport minus header & footer */
">
  <router-outlet></router-outlet>
</main>

<!-- Optional: Footer -->
<footer style="
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 5px;
  background: url('/assets/icons/footerImg.jpg') no-repeat center center;
  background-size: cover;
  color: #fff;
  text-align: center;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  font-size: 12px;
  z-index: 9999;
  height: 25px;
  line-height: 15px;
  text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
">
  <!-- Overlay for reduced opacity -->
  <div style="
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.4);
    z-index: 0;
  "></div>
  <p style="position: relative; z-index: 1; margin: 0;">&copy; 2025 Online Election System</p>
</footer>
